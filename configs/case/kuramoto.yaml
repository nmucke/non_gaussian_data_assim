# @package _global_
data_assimilation_steps: 200
model_integration_steps: 10
ensemble_size: 50

case:
  name: kuramoto
  title: "Kuramoto-Sivashinsky"
  num_states: 1
  state_dim: 512
  obs_noise_variance: 0.1
  domain_length: 100

  forward_model:
    _target_: non_gaussian_data_assim.forward_models.kuramoto_sivashinsky.KuramotoSivashinsky
    dt: 0.05
    model_integration_steps: ${model_integration_steps}
    state_dim: ${case.state_dim}
    domain_length: ${case.domain_length}

  obs_operator:
    _target_: non_gaussian_data_assim.observations.observation_operator.LinearObservationOperator
    state_dim: ${case.state_dim}
    obs_states: [0]
    obs_indices:
      _target_: numpy.arange
      start: 0
      stop: ${case.state_dim}
      step: 4

  initial_state:
    _target_: non_gaussian_data_assim.experiment.kuramoto_cosine_initial_state
    _partial_: true
    state_dim: ${case.state_dim}
    domain_length: ${case.domain_length}
    magnitude: 0.1

  prior_ensemble:
    _target_: non_gaussian_data_assim.experiment.kuramoto_cosine_prior_ensemble
    _partial_: true
    state_dim: ${case.state_dim}
    domain_length: ${case.domain_length}
    magnitude_min: 0.0
    magnitude_max: 1.5

  plotter:
    _target_: non_gaussian_data_assim.plotting.plot_high_dim_field
    _partial_: true

  da_method_overrides:
    enkf:
      inflation_factor: 1.0
      localization_distance: 10
    agmf:
      inflation_factor: 1.0
      nc_threshold: 0.5
      localization_distance: 10
    pff:
      num_pseudo_time_steps: 100
      step_size: 1.0
      stepper: forward_euler
      localization_distance: 10
