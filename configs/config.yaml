defaults:
  - _self_
  - case: lorenz_63
  - da_method: enkf

# Re-run a saved experiment by name (folder under ./experiments). When set, its
# saved config/config.yaml is loaded and used instead of the composed config.
experiment: null

# Common, case-agnostic settings.
seed: 42

# Sensible fallbacks; each case file overrides these to match its needs.
data_assimilation_steps: 100
model_integration_steps: 50
ensemble_size: 100
spinup_steps: null # spinup run for spinup_steps * model_integration_steps

hydra:
  output_subdir: null
  run:
    dir: .
