# @package da_method
name: pff
_target_: non_gaussian_data_assim.da_methods.pff.ParticleFlowFilter
num_pseudo_time_steps: 100
inflation_factor: 1.0
step_size: 0.05
stepper: forward_euler
localization_distance: null
# Regularization is effectively always required: the Gaussian-prior PFF needs an
# invertible prior covariance, but jnp.cov is rank-deficient whenever
# dofs >= ensemble_size (e.g. Kuramoto). Adds reg * mean(diag(cov)) * I.
prior_cov_regularization: 1.0e-2
periodic: false
