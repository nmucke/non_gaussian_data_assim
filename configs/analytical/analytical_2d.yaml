# 2D linear-Gaussian DA experiment scored against the analytical Kalman filter.
# See scripts/main_analytical.py for the loop. All matrices must agree with
# the dimension implied by `prior_mean` (validated at runtime).
#
# Scalar shortcut: a single number for any of the covariance fields below is
# interpreted as that scalar times the identity matrix of the right size.

defaults:
  - _self_

seed: 42
state_dim: 2                              # MUST match len(prior_mean) and the matrices below

# Linear forward model:  x_{k+1} = M x_k  (per inner step).
# Mild rotation + contraction.
transition_matrix: [[0.95, 0.10], [-0.10, 0.95]]
model_integration_steps: 1                # inner steps between assimilations

process_noise_cov: 0.05                   # Q = 0.05 * I
obs_noise_cov: 0.5                        # R = 0.5 * I
prior_mean: [2.0, -1.0]
prior_cov: 1.0                            # P0 = 1.0 * I

ensemble_size: 100
data_assimilation_steps: 30

forward_model:
  _target_: non_gaussian_data_assim.forward_models.linear.LinearModel
  transition_matrix: ${transition_matrix}
  model_integration_steps: ${model_integration_steps}

# Default: identity observation operator (observe every state component).
# Edit `obs_indices` to observe a subset (e.g. `[0]` to observe only state[0]),
# and `obs_noise_cov` must then have shape (num_obs, num_obs) -- the scalar
# shortcut still expands to (num_obs * num_obs) when obs_operator is identity.
obs_operator:
  _target_: non_gaussian_data_assim.observations.observation_operator.LinearObservationOperator
  obs_states: [0]
  obs_indices:
    _target_: numpy.arange
    start: 0
    stop: ${state_dim}
  state_dim: ${state_dim}
  num_states: 1

# Ensemble DA methods to compare against the analytical Kalman filter.
# Comment a method out to skip it; add another by following the same pattern.
da_methods:
  EnKF:
    _target_: non_gaussian_data_assim.da_methods.enkf.EnsembleKalmanFilter
    ensemble_size: ${ensemble_size}
    inflation_factor: 1.0
  AGMF:
    _target_: non_gaussian_data_assim.da_methods.agmf.AdaptiveGaussianMixtureFilter
    ensemble_size: ${ensemble_size}
    w_prev:
      _target_: non_gaussian_data_assim.da_methods.agmf.uniform_weights
      ensemble_size: ${ensemble_size}
    nc_threshold: 0.5
    inflation_factor: 1.0
  ParticleFilter:
    _target_: non_gaussian_data_assim.da_methods.particle_filter.ParticleFilter
    ensemble_size: ${ensemble_size}
    resample_threshold: 0.5
    jitter_scale: 0.0
  # PFF (uncomment to include -- slower):
  # PFF:
  #   _target_: non_gaussian_data_assim.da_methods.pff.ParticleFlowFilter
  #   ensemble_size: ${ensemble_size}
  #   num_pseudo_time_steps: 500
  #   step_size: 0.1
  #   alpha: 0.1
  #   stepper: forward_euler

hydra:
  output_subdir: null
  run:
    dir: .
