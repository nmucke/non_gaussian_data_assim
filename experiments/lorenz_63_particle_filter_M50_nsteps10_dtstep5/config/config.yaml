seed: 42
data_assimilation_steps: 10
model_integration_steps: 5
ensemble_size: 50
spinup_steps: 100
inflation_factor: 1.0
save:
  experiment: true
  figures: true
  savename_appendix: ''
case:
  name: lorenz_63
  title: Lorenz 63
  num_states: 1
  state_dim: 3
  obs_noise_variance: 5.0
  forward_model:
    _target_: non_gaussian_data_assim.forward_models.lorenz_63.Lorenz63Model
    dt: 0.01
    model_integration_steps: ${model_integration_steps}
    sigma: 10.0
    beta: 2.6666666
    rho: 28.0
  obs_operator:
    _target_: non_gaussian_data_assim.observations.observation_operator.LinearObservationOperator
    state_dim: ${case.state_dim}
    obs_states:
    - 0
    obs_indices:
      _target_: numpy.arange
      start: 0
      stop: 3
  true_initial_state:
    _target_: non_gaussian_data_assim.initial_profiles.WhiteNoiseProfile
    num_states: ${case.num_states}
    state_dim: ${case.state_dim}
    periodic: false
    scale: 10.0
  initial_ensemble:
    _target_: non_gaussian_data_assim.ensemble_generation.initial_ensemble.InitialEnsemble
    centered_around_bestguess: true
    periodic: false
    ens_perturbation:
      _target_: non_gaussian_data_assim.ensemble_generation.ensemble_perturbations.WhiteNoise
      num_states: ${case.num_states}
      state_dim: ${case.state_dim}
      scale: 10.0
  plotter:
    _target_: non_gaussian_data_assim.plotting.plot_fields.plot_low_dim_trajectory
    _partial_: true
    state_names:
    - x
    - 'y'
    - z
  da_method_overrides:
    enkf:
      inflation_factor: ${inflation_factor}
      localization_distance: null
    agmf:
      inflation_factor: ${inflation_factor}
      nc_threshold: 0.5
      localization_distance: null
    pff:
      num_pseudo_time_steps: 5000
      step_size: 0.05
      stepper: runge_kutta_4
      localization_distance: null
      inflation_factor: ${inflation_factor}
    particle_filter:
      resample_threshold: 0.5
      jitter_scale: 0.5
da_method:
  name: particle_filter
  _target_: non_gaussian_data_assim.da_methods.particle_filter.ParticleFilter
  resample_threshold: 0.5
  jitter_scale: 0.0
