experiment: null
seed: 42
data_assimilation_steps: 40
model_integration_steps: 10
ensemble_size: 50
spinup_steps: 40
inflation_factor: 1.4
localization_distance: 100
forecast_steps: 15
save:
  experiment: true
  figures: true
  savename_appendix: ''
case:
  name: kuramoto
  title: Kuramoto-Sivashinsky
  num_states: 1
  state_dim: 512
  obs_noise_variance: 0.5
  domain_length: 100
  forward_model:
    _target_: non_gaussian_data_assim.forward_models.kuramoto_sivashinsky.KuramotoSivashinsky
    dt: 0.05
    model_integration_steps: ${model_integration_steps}
    state_dim: ${case.state_dim}
    domain_length: ${case.domain_length}
  obs_operator:
    _target_: non_gaussian_data_assim.observations.observation_operator.LinearObservationOperator
    state_dim: ${case.state_dim}
    obs_states:
    - 0
    obs_indices:
      _target_: numpy.arange
      start: 0
      stop: ${case.state_dim}
      step: 32
    validation_indices:
      _target_: numpy.arange
      start: 192
      stop: 320
      step: 8
  use_best_guess: true
  true_initial_state:
    _target_: non_gaussian_data_assim.ensemble_generation.initial_state.InitialState
    spinup_steps: ${spinup_steps}
    periodic: true
    initial_profile:
      _target_: non_gaussian_data_assim.initial_profiles.CosineProfile
      num_states: ${case.num_states}
      state_dim: ${case.state_dim}
      domain_length: ${case.domain_length}
      periodic: true
      magnitude: 1
  initial_ensemble:
    _target_: non_gaussian_data_assim.ensemble_generation.initial_ensemble.InitialEnsembleGenerator
    periodic: true
    spinup_steps: ${spinup_steps}
    use_best_guess: true
    initial_profile:
      _target_: non_gaussian_data_assim.initial_profiles.CoupledKuramotoPseudo1DProfile
      num_states: ${case.num_states}
      state_dim: ${case.state_dim}
      domain_length: ${case.domain_length}
      decorrelation_length: 10.0
      scale: 1.0
    perturbation:
      _target_: non_gaussian_data_assim.perturbations.red_noise.RedNoise
      num_states: ${case.num_states}
      state_dim: ${case.state_dim}
      domain_length: ${case.domain_length}
      scale: 1.5
      alpha: 2
  plotter:
    _target_: non_gaussian_data_assim.plotting.plot_fields.plot_high_dim_field
    _partial_: true
  da_method_overrides:
    enkf:
      inflation_factor: ${inflation_factor}
      localization_distance: ${localization_distance}
      periodic: ${case.true_initial_state.periodic}
    agmf:
      inflation_factor: ${inflation_factor}
      nc_threshold: 0.5
      localization_distance: ${localization_distance}
      periodic: ${case.true_initial_state.periodic}
    pff:
      num_pseudo_time_steps: 10
      step_size: 0.1
      stepper: forward_euler
      localization_distance: ${localization_distance}
      inflation_factor: ${inflation_factor}
      prior_cov_regularization: 0.01
      periodic: ${case.true_initial_state.periodic}
    particle_filter:
      resample_threshold: 0.5
      jitter_scale: 0.05
da_method:
  name: enkf
  _target_: non_gaussian_data_assim.da_methods.enkf.EnsembleKalmanFilter
  inflation_factor: 1.0
  localization_distance: null
  periodic: false
